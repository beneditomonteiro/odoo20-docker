[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
; Database Manager master password - replace with a random value
admin_passwd = CHANGE_ME_MASTER
; Odoo 20 defaults to 127.0.0.1 - must be 0.0.0.0 inside a container
http_interface = 0.0.0.0
; workers = 0 -> single process (dev). Production: workers = (2*CPU)+1, nginx in front.
workers = 0
list_db = True
