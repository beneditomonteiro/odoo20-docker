name: odoo20
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    image: messiazmonteiro/odoo20-core:20.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_PORT:-9021}:8069"
      - "127.0.0.1:${ODOO_LONGPOLL_PORT:-9022}:8072"
    environment:
      HOST: postgres
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons

volumes:
  pgdata:
  odoo_data:
